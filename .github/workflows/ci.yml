name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt pyflakes
      - run: playwright install --with-deps chromium
      - run: python -m pyflakes app.py db.py lead_scraper.py sync_leads.py tests
      - run: python -m unittest discover -s tests -t .
