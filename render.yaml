services:
  - type: web
    name: trashleadgen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SCRAPER
        value: osm # low-memory scraper for the free plan
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_USERNAME
        sync: false # comma-separated, set in the Render dashboard
      - key: APP_PASSWORD
        sync: false # set this in the Render dashboard, never in git
