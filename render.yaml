services:
  - type: web
    name: trashleadgen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_USERNAME
        sync: false # comma-separated, set in the Render dashboard
      - key: APP_PASSWORD
        sync: false # set this in the Render dashboard, never in git
      - key: SUPABASE_DB_URL
        sync: false # Postgres connection string -- set this in the Render dashboard, never in git
      - key: GITHUB_TOKEN
        sync: false # optional fallback backup -- set this in the Render dashboard, never in git
      - key: GITHUB_REPO
        sync: false # optional fallback backup, "owner/name" -- only needed alongside GITHUB_TOKEN
